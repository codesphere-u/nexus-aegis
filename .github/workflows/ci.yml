name: NexusAegis CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Runtime Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit runtime & server dependencies with pip-audit
        run: |
          python -m venv .audit-venv
          .audit-venv/bin/python -m pip install --upgrade pip pip-audit
          .audit-venv/bin/pip install --no-cache-dir -e ".[server]"
          .audit-venv/bin/pip-audit --skip-editable --progress-spinner off

  docker-build:
    name: Docker Image Build & Non-Root Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker image
        run: docker build -t nexus-aegis:ci .
      - name: Verify non-root container & package import
        run: docker run --rm nexus-aegis:ci python -c "import os, nexus_aegis; assert os.geteuid() != 0"

  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package, ASGI server, and dev tools
        run: python -m pip install --upgrade pip && pip install -e ".[dev,server]"

      - name: Lint with ruff
        run: ruff check .

      - name: Static type check with mypy
        run: mypy nexus_aegis api

      - name: Run full test suite with coverage gate
        run: pytest -v --cov=nexus_aegis --cov-report=term-missing --cov-fail-under=90

      - name: Verify live HTTP & MCP smoke test
        run: python scripts/smoke_test.py

      - name: Verify CLI gates, demo & 35-scenario benchmark
        run: |
          nexus-aegis gates
          nexus-aegis demo
          nexus-aegis benchmark --json > /dev/null
