name: NexusAegis CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify-pcae-kernel:
    name: "PCAE 7-Gate Kernel & RFC 6962 Merkle Suite (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run 77-test pytest suite
        run: |
          pytest -v

      - name: Run CLI live demo & 35-scenario benchmark verification
        run: |
          nexus-aegis gates
          nexus-aegis demo
          nexus-aegis benchmark
