name: NexusAegis CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package, ASGI server, and dev tools
        run: python -m pip install --upgrade pip && pip install -e ".[dev,server]"

      - name: Lint with ruff
        run: ruff check .

      - name: Static type check with mypy
        run: mypy nexus_aegis api

      - name: Run full test suite with coverage gate
        run: pytest -v --cov=nexus_aegis --cov-report=term-missing --cov-fail-under=90

      - name: Verify live HTTP & MCP smoke test
        run: python scripts/smoke_test.py

      - name: Verify CLI gates, demo & 35-scenario benchmark
        run: |
          nexus-aegis gates
          nexus-aegis demo
          nexus-aegis benchmark --json > /dev/null
