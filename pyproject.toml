[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-aegis"
version = "1.0.0"
description = "Proof-Carrying Autonomous Agent Kernel & Cryptographic PR Attestation Engine (RFC 6962 Merkle Proofs + 7-Gate PCAE Pipeline + MCP Server)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Akandwanaho Ivan Alvin", email = "codesphere.innovations@gmail.com" }
]
keywords = [
    "proof-carrying-code",
    "ai-agents",
    "merkle-tree",
    "rfc6962",
    "agent-safety",
    "reward-hacking",
    "hallucination-detection",
    "mcp-server",
    "cryptographic-attestation",
    "pull-request-verification"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
nexus-aegis = "nexus_aegis.cli:main"

[tool.setuptools.packages.find]
include = ["nexus_aegis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
